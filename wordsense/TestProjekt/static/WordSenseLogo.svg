<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 300 200"
     width="400" height="260">

  <!-- Centered group -->
  <g transform="translate(165 100) translate(-30 0)">

    <!-- W in front -->
    <text x="0" y="0"
          font-family="Times New Roman, serif"
          font-size="160"
          font-weight="800"
          fill="black"
          stroke="gray"
          stroke-width="6"
          text-anchor="middle"
          dominant-baseline="middle">
      W
    </text>

    <!-- S behind -->
    <text x="60" y="30"
          font-family="Times New Roman, serif"
          font-size="160"
          font-weight="750"
          fill="black"
          stroke="gray"
          stroke-width="6"
          text-anchor="middle"
          dominant-baseline="middle">
      S
    </text>



  </g>
</svg>
